[[item]]
date = "2026-09-01"
text = "I have been awarded an Australian Research Council Future Fellowship (FT260101599) to investigate how learned associations with information value shape attention and decision-making. <a href=\"research.html\">More about the project</a>."


[[item]]
date = "2025-10-01"
text = "Our project on attentional exploitation versus exploration has been awarded an Australian Research Council Discovery Project grant (DP260101915). Using eye tracking and electrophysiological methods, we will test how attention balances exploiting reliable information against exploring for potential information. <a href=\"research.html\">More about the project</a>."
