# Research projects, shown on research.html in the order listed. Projects have no dates.
# To add one, copy a [[project]] block and fill in:
#   title         (required) plain text
#   description   (required) one to three sentences; inline HTML such as <a href="...">links</a> is allowed
#   papers        (optional) list of citation keys from content/publications.bib; each is shown
#                 under "Key papers" as "Surname et al. (Year). Title." linked to its DOI
#   collaborators (optional) list of names, shown as "With A, B"
# An unknown key in `papers` stops the build with an error.
#
# `intro` (optional) is a list of paragraphs shown above the projects; inline HTML is allowed.

intro = [
  "My research investigates how learned associations determine what captures our attention. I use eye-tracking, electrophysiological techniques and computational modelling to explore how these attention mechanisms operate, adapt to changing environments and influence decision-making. This work has applications ranging from designing effective health and public policy communications to understanding addiction, vulnerability to misinformation and compulsive information-seeking.",
]

[[project]]
title = "Reward and attention"
description = "How learned associations with reward, such as money, food or drugs, come to automatically capture attention, even when doing so works against our goals, and what this means for addiction."
papers = ["le2015goals", "pearson2016value", "albertella2019reward"]

[[project]]
title = "Information value and attention"
description = "How learned associations with information value shape attention and influence decision-making. Using eye-tracking, this project examines which information sources capture attention and the consequences for choices, and how individual differences in attention to information relate to anxious and compulsive traits, with the aim of informing public health communication and strategies to reduce misinformation. Funded by an Australian Research Council Future Fellowship."

[[project]]
title = "Attentional exploitation versus exploration"
description = "Understanding and optimising how attention balances exploiting what we have learned against exploring new information. Funded by the Australian Research Council (2026&ndash;2030)."
collaborators = ["Mike Le Pelley", "Kelly Garner", "Jan Theeuwes"]
